name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Pega uma mudanca de .sq sem o .sqm correspondente. Sem isso, a falta de
      # migration compila, passa nos testes, e so aparece em runtime como
      # "no such column" — ou, quando a mudanca e de coluna, como perda
      # silenciosa dos dados do usuario numa instalacao ja existente.
      - name: Verify SQLDelight migrations
        run: ./gradlew :composeApp:verifySqlDelightMigration

      - name: Run tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/reports/tests/
