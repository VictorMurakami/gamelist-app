name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Mesma verificacao do pr-check. Aqui importa mais: um release com
      # migration faltando chega em instalacao existente de usuario real.
      - name: Verify SQLDelight migrations
        run: ./gradlew :composeApp:verifySqlDelightMigration

      - name: Run tests
        run: ./gradlew :composeApp:allTests

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/
